<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MIFIKA Micro-Finance</title><style>
:root{--bg:#f4efe4;--fg:#1f2a1c;--cd:#fff;--g:#2f5d2a;--r:#9b3a1e;--mu:#6b6f60;--bd:#ddd5c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a12;--fg:#eee9dc;--cd:#1e271b;--g:#5f9a50;--r:#e0805f;--mu:#a3a898;--bd:#33402f}}
:root[data-theme="dark"]{--bg:#141a12;--fg:#eee9dc;--cd:#1e271b;--g:#5f9a50;--r:#e0805f;--mu:#a3a898;--bd:#33402f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:.2em 0 .5em}
.w{max-width:760px;margin:auto;padding:12px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--g);color:#fff}
header img{height:36px;width:36px;object-fit:cover;border-radius:50%;background:#f4efe4}header b{flex:1;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px}nav button{white-space:nowrap}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
button,.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer}
button.o{background:none;color:var(--g);border:1px solid var(--g)}button.on{background:var(--r)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:3px 0 9px}
label{font-size:13px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.k{font-size:12px;color:var(--mu)}.k b{display:block;font-size:16px;color:var(--fg)}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:5px;text-align:left}
.rd{color:var(--r);font-weight:600}
#doc{position:fixed;inset:0;background:#fff;color:#111;overflow:auto;padding:16px;z-index:9}
#doc .bar{display:flex;gap:8px;margin-bottom:10px}#doc td,#doc th{border:1px solid #bbb}
canvas{border:1px dashed var(--mu);border-radius:8px;width:100%;height:110px;touch-action:none;background:#fff}
@media print{#app,#doc .bar{display:none}#doc{position:static}}

return`<div style="font:13px/1.45 Georgia,serif"><div style="text-align:right;font-size:11px">Paraphes : Prêteur ____ Emprunteur ____ Garant ____</div>`+hd('CONTRAT DE PRÊT MICRO-FINANCE')+P(`N° du contrat : <b>${c.n}</b> · N° du dossier : <b>${c.n}</b>`)+P('Entre les soussignés : <b>MIFIKA MICRO-FINANCE</b>, représentée par son Gérant, ci-après « MIFIKA » ou « le Prêteur », et :')+P(`Nom de l’Emprunteur : <b>${f(m.nom)}</b><br>N° Carte d’électeur / CNI : <b>${f(m.cni)}</b><br>Adresse : <b>${f(m.adr)}</b><br>Téléphone : <b>${f(m.tel)}</b><br>ci-après « l’Emprunteur ». Il a été convenu et arrêté ce qui suit :`)
+A('ARTICLE 1 - OBJET DU CONTRAT',P('MIFIKA accorde à l’Emprunteur un prêt de micro-finance destiné exclusivement à l’objet déclaré dans la demande de prêt et la fiche d’évaluation du client. L’Emprunteur s’engage à le rembourser selon les conditions ci-dessous.')+P(`Objet précis du prêt : <b>${f(c.obj)}</b>`))

+A('ARTICLE 5 - MODALITÉS DE REMBOURSEMENT',P(`Le remboursement s’effectue par échéances ${fq} de : <b>${fm(c.tot/c.sched.length)}</b>, selon le carnet de remboursement remis à l’Emprunteur. Chaque paiement est inscrit et signé dans ce carnet, que l’Emprunteur doit présenter à chaque remboursement. Total à rembourser : <b>${fm(c.tot)}</b>.`)+sch(c))
+A('ARTICLE 6 - ÉPARGNE OBLIGATOIRE BLOQUÉE (10 %)',P('6.1 - L’Emprunteur constitue une épargne obligatoire égale à 10 % du montant du prêt, bloquée sur un compte ouvert chez MIFIKA à son nom.')+P('6.2 - Cette épargne n’est pas rémunérée et sert de garantie complémentaire.')+P('6.3 - Elle est restituée à l’Emprunteur 7 jours après le remboursement intégral, déduction faite des sommes éventuellement dues. Elle ne peut être retirée avant.')+P('6.4 - En cas d’échéance impayée depuis plus de 7 jours, l’Emprunteur autorise MIFIKA à compenser cette échéance avec l’épargne bloquée.'))
+A('ARTICLE 7 - ASSURANCE DÉCÈS-INVALIDITÉ (2 %)',P('7.1 - Une prime de 2 % du montant du prêt est obligatoire et prélevée à la source lors du décaissement.')+P('7.2 - En cas de décès de l’Emprunteur constaté par acte de décès et certificat médical, l’assureur partenaire de MIFIKA prend en charge le solde restant dû.')+P('7.3 - Exclusions : suicide dans les 12 premiers mois, fausse déclaration, décès dû à l’alcool ou à la drogue, participation à une émeute. Dans ces cas, la dette reste due par la succession de l’Emprunteur et par le Garant.')+P('7.4 - L’Emprunteur informe sans délai MIFIKA de toute maladie grave.'))
+A('ARTICLE 8 - GARANT PERSONNEL, SOLVABLE ET SOLIDAIRE',P(`8.1 - Identification du Garant. Le Garant se porte caution personnelle, solvable et solidaire :<br>Nom complet : <b>${f(g.nom)}</b><br>N° Carte d’électeur / CNI : <b>${f(g.cni)}</b><br>Profession / activité : <b>${f(g.pro)}</b><br>Adresse : <b>${f(g.adr)}</b><br>Téléphone : <b>${f(g.tel)}</b> · Téléphone 2 : ${b(14)}<br>Lien avec l’Emprunteur : <b>${f(g.lien)}</b><br>Revenu mensuel estimé : ${b(14)} CDF · Biens possédés : ${b(30)}<br>Pièces à fournir : photocopie certifiée de la CNI, 1 photo passeport, attestation de résidence ou preuve d’activité.`)+P(`8.2 - Engagement du Garant (à recopier à la main). « Je soussigné(e), ${f(g.nom)}, m’engage de manière irrévocable, personnelle et solidaire à rembourser à MIFIKA MICRO-FINANCE, à première demande et sans exiger que MIFIKA poursuive d’abord l’Emprunteur, la totalité des sommes dues par ${f(m.nom)} au titre du présent contrat : principal, intérêts, pénalités, prime d’assurance, et frais de recouvrement prévus à l’article 12. Je déclare connaître la situation financière de l’Emprunteur, l’étendue de mon engagement, et disposer de revenus suffisants pour l’honorer. »<br>Mention manuscrite du Garant :<br>${b(95)}<br>${b(95)}<br>${b(95)}`)+P('8.3 - Solidarité et indivisibilité. Le Garant renonce au bénéfice de discussion et de division : MIFIKA peut le poursuivre directement pour la totalité. En cas de plusieurs Garants, ils sont solidaires entre eux. Le Garant ne peut se prévaloir d’un délai accordé à l’Emprunteur.')+P('8.4 - Information du Garant. En cas d’impayé de plus de 3 jours, MIFIKA avertit le Garant verbalement puis par écrit ; le Garant dispose de 48 heures pour régulariser. Le Garant informe MIFIKA de tout changement d’adresse ou de téléphone et accepte d’être visité à son domicile.')+P('8.5 - Durée. L’engagement du Garant prend effet à la signature et prend fin au remboursement intégral du capital, des intérêts et des frais. Il subsiste en cas de décès de l’Emprunteur, sauf si l’assurance (article 7) couvre le solde.')+P(`Personne de contact du Garant en cas d’absence : Nom : ${b(16)} Tél : ${b(14)}`))
+A('ARTICLE 9 - GROUPE SOLIDAIRE (si applicable)',P('9.1 - Les membres du groupe sont solidairement responsables du remboursement.')+P('9.2 - Le défaut de paiement d’un membre entraîne le blocage de l’accès au crédit pour le groupe jusqu’à régularisation.'))
+A('ARTICLE 10 - OBLIGATIONS DE L’EMPRUNTEUR ET VISITES DE CONTRÔLE',P('10.1 - L’Emprunteur utilise le prêt uniquement pour l’objet déclaré, fournit des informations exactes et rembourse aux dates prévues.')+P('10.2 - Il informe MIFIKA de tout changement d’adresse, de téléphone ou d’activité.')+P('10.3 - Il autorise MIFIKA à effectuer des visites inopinées à son domicile ou lieu d’activité, pour vérifier l’activité et l’utilisation du prêt. Tout refus constitue un manquement grave.'))
+A('ARTICLE 11 - RETARD, DÉFAILLANCE ET EXIGIBILITÉ IMMÉDIATE',P('11.1 - Pénalités de retard :<br>• Retard de 1 à 3 jours : avertissement et frais de relance de 2 000 CDF.<br>• Retard de 4 à 7 jours : pénalité de 5 % du montant de l’échéance.<br>• Retard de plus de 7 jours : pénalité de 10 % de l’échéance, exigibilité immédiate possible et frais de recouvrement (article 12).')+P('11.2 - Cas de défaillance : échéance impayée depuis plus de 7 jours ; fausse déclaration ; détournement de l’objet du prêt ; refus de visite ; fuite ou déménagement sans prévenir MIFIKA ; détérioration grave de la solvabilité du Garant.')+P('11.3 - Conséquences : en cas de défaillance, MIFIKA peut (a) exiger immédiatement la totalité du solde dû (capital, intérêts, pénalités) ; (b) utiliser l’épargne bloquée (article 6) ; (c) poursuivre le Garant pour la totalité (article 8) ; (d) engager le recouvrement par les voies légales (article 12) ; (e) inscrire l’Emprunteur et le Garant dans son fichier interne des mauvais payeurs, et partager l’information dans le cadre autorisé par la réglementation.'))
+A('ARTICLE 12 - RECOUVREMENT ET FRAIS',P('12.1 - En cas de recouvrement forcé, les frais d’huissier, de tribunal, d’avocat et de transport sont à la charge de l’Emprunteur et du Garant solidaire.')+P('12.2 - MIFIKA peut facturer ces frais forfaitairement, sur justificatifs.'))
+A('ARTICLE 13 - LITIGES ET DROIT APPLICABLE',P('13.1 - Règlement amiable : les parties cherchent d’abord une solution amiable pendant 8 jours, par médiation au bureau de MIFIKA à Q. Kasanga, Kasongo-Lunda.')+P('13.2 - Tribunal compétent : à défaut, le litige est porté devant le Tribunal de Paix de Kasongo-Lunda (montants inférieurs à 2 500 000 CDF) ou le Tribunal de Grande Instance de Kenge (montants supérieurs ou égaux à 2 500 000 CDF). L’Emprunteur et le Garant font élection de domicile à l’adresse indiquée au contrat ; toute notification à cette adresse est réputée reçue.')+P('13.3 - Droit applicable : le contrat est régi par le droit OHADA, les lois de la RDC et les instructions de la Banque Centrale du Congo en matière de microfinance.'))
+A('ARTICLE 14 - DISPOSITIONS FINALES',P('14.1 - Le contrat entre en vigueur à la signature et au décaissement effectif des fonds. Le décaissement vaut reconnaissance de dette.')+P('14.2 - Il est établi en 3 exemplaires originaux : un pour MIFIKA, un pour l’Emprunteur, un pour le Garant.')+P('14.3 - L’Emprunteur et le Garant déclarent avoir lu et compris toutes les clauses (explications données en Kikongo / Lingala / Français), avoir reçu le carnet de remboursement, et s’engager à respecter les échéances.')+P('14.4 - Le fait pour MIFIKA de ne pas appliquer une clause à un moment donné ne vaut pas renonciation à l’appliquer ensuite.')+P('14.5 - Le contrat annule et remplace tout accord verbal antérieur.'))
+P(`<br>Fait à Kasongo-Lunda, Q. Kasanga, le <b>${c.start}</b>`)+`<table><tr><td>POUR MIFIKA<br>Le Gérant - Cachet et signature<br>${ck}<br>Nom : ${b(14)}<td>L’EMPRUNTEUR<br>« Lu et approuvé, bon pour reconnaissance de dette de ${fm(c.montant)} »<br>${c.sig?`<img src="${c.sig.e}" height=70>`:'<br><br><br>'}<br>Nom : ${f(m.nom)}<br>Empreinte : pouce droit [ ] gauche [ ]<td>LE GARANT<br>« Lu et approuvé, bon pour caution solidaire et indivisible pour la somme de ${fm(c.tot)} + intérêts et frais »<br>${c.sig?`<img src="${c.sig.g}" height=70>`:'<br><br><br>'}<br>Nom : ${f(g.nom)}<br>Empreinte : pouce droit [ ] gauche [ ]</table>`+P(`TÉMOIN 1 (Chef de quartier Q. Kasanga ou famille - facultatif) Nom : ${b(14)} Signature : ${b(14)}`)+P(`TÉMOIN 2 (facultatif) Nom : ${b(14)} Signature : ${b(14)}`)+'</div>'};
